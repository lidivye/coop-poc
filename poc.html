
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>COOP Security PoC</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #ffffff;
            font-family: Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            text-align: center;
            padding: 20px;
        }

        button {
            padding: 12px 25px;
            background: #596bc1;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }

        button:hover {
            background: #4859aa;
        }

        button:disabled {
            background: #999;
            cursor: not-allowed;
        }

        #status {
            font-size: 14px;
            color: #555;
            margin-top: 18px;
        }
    </style>
</head>

<body>

<div class="container">

    <button id="start">
        Start COOP Demonstration
    </button>

    <p id="status">
        Authorized security testing demonstration.
    </p>

</div>

<script>

    // Read target from URL parameter
    const params = new URLSearchParams(window.location.search);
    const targetUrl = params.get("target");

    const start = document.getElementById("start");
    const status = document.getElementById("status");

    let targetWindow = null;

    start.addEventListener("click", function () {

        let target;

        // Validate target URL
        try {
            target = new URL(targetUrl);

            if (!["http:", "https:"].includes(target.protocol)) {
                throw new Error("Invalid protocol");
            }

        } catch (error) {
            status.textContent = "Invalid or missing target URL.";
            return;
        }

        // Open target in a new window
        targetWindow = window.open(target.href, "_blank");

        if (!targetWindow) {
            status.textContent =
                "Popup blocked. Allow popups and retry.";
            return;
        }

        // Disable button after successful opening
        start.disabled = true;

        status.textContent =
            "Target opened. Waiting 5 seconds...";

        // Wait 5 seconds before controlled navigation
        setTimeout(function () {

            if (targetWindow.closed) {
                status.textContent =
                    "Target window is closed.";
                return;
            }

            status.textContent =
                "Controlled navigation test initiated.";

            // Navigate to the controlled demonstration page
            const destination = new URL(
                "destination.html",
                window.location.href
            );

            try {
                targetWindow.location.href = destination.href;

                status.textContent =
                    "Navigation attempted. Check the opened window.";

            } catch (error) {

                status.textContent =
                    "Navigation blocked: " + error.message;

            }

        }, 5000);

    });

</script>

</body>
</html>
