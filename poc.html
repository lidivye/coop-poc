
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>COOP Security PoC</title>

    <style>
        body {
            margin: 0;
            background: #ffffff;
            font-family: Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        button {
            padding: 12px 25px;
            background: #596bc1;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }

        #status {
            font-size: 14px;
            color: #555;
            margin-top: 18px;
        }

        .container {
            text-align: center;
        }
    </style>
</head>

<body>

<div class="container">
    <button id="start">Start COOP Demonstration</button>
    <p id="status">Authorized security testing demonstration.</p>
    <button id="navigate" hidden>
        Navigate to Controlled Demo Page
    </button>
</div>

<script>
    const params = new URLSearchParams(window.location.search);
    const targetUrl = params.get("target");

    const status = document.getElementById("status");
    const start = document.getElementById("start");
    const navigate = document.getElementById("navigate");

    let targetWindow = null;

    start.addEventListener("click", () => {
        let target;

        try {
            target = new URL(targetUrl);

            if (!["http:", "https:"].includes(target.protocol)) {
                throw new Error("Invalid protocol");
            }
        } catch {
            status.textContent = "Invalid or missing target URL.";
            return;
        }

        targetWindow = window.open(target.href, "_blank");

        if (!targetWindow) {
            status.textContent = "Popup blocked. Allow popups and retry.";
            return;
        }

        start.hidden = true;
        status.textContent =
            "Target opened. Waiting 5 seconds...";

        setTimeout(() => {
            status.textContent =
                "Ready for controlled navigation testing.";

            navigate.hidden = false;
        }, 5000);
    });

    navigate.addEventListener("click", () => {
        try {
            if (!targetWindow || targetWindow.closed) {
                status.textContent =
                    "Target window is no longer available.";
                return;
            }

            targetWindow.location.href =
                new URL("destination.html", window.location.href).href;

            status.textContent =
                "Navigation attempted. Check the target window.";

        } catch (error) {
            status.textContent =
                "Navigation failed: " + error.message;
        }
    });
</script>

</body>
</html>
